<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZINAR 512 - دخول</title>
<style>
body{margin:0;background:#0a0f1e;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{width:90%;max-width:360px;background:#151b2e;border-radius:20px;padding:28px;border:1px solid #223}
h1{text-align:center;margin:0}h1 span{color:#38bdf8}
input{width:100%;padding:14px;margin:10px 0;border-radius:12px;border:1px solid #334;background:#0a0f1e;color:#fff;text-align:center;font-size:18px}
button{width:100%;padding:14px;background:#38bdf8;border:none;border-radius:12px;font-weight:900;font-size:18px;margin-top:10px}
p{font-size:12px;opacity:.5;text-align:center;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h1>ZINAR <span>512</span></h1>
<p>ادخل كود الكرت للاتصال</p>
<form id="f">
<input id="u" placeholder="كود الكرت" required>
<input id="p" placeholder="كلمة السر - نفس الكود" required>
<button type="submit">اتصال 🚀</button>
</form>
<p id="msg"></p>
<p>zinar.net-radius.onrender.com</p>
</div>
<script>
const loginLink = new URLSearchParams(location.search).get('link-login') || 'http://13.13.13.13/login';
const orig = new URLSearchParams(location.search).get('link-orig') || 'https://google.com';
document.getElementById('u').addEventListener('input',e=>{document.getElementById('p').value=e.target.value});
document.getElementById('f').onsubmit = e=>{
 e.preventDefault();
 const u=document.getElementById('u').value.trim();
 const p=document.getElementById('p').value.trim()||u;
 document.getElementById('msg').innerText='جاري الاتصال...';
 const form=document.createElement('form');form.method='post';form.action=loginLink;
 [['username',u],['password',p],['dst',orig]].forEach(k=>{let i=document.createElement('input');i.type='hidden';i.name=k[0];i.value=k[1];form.appendChild(i);});
 document.body.appendChild(form);form.submit();
}
</script>
</body>
</html>
